# Coolify → Docker Compose deployment for SoftwarePros.
#
# One service, on purpose. Migrations run in the container's entrypoint
# (scripts/docker-entrypoint.sh) before `next start`, so the schema is always
# applied and there is nothing to remember at deploy time — which is the whole
# point, after `ref: db_not_migrated` reached visitors.
#
# An earlier version split this into a one-shot `migrate` service that `app`
# waited on. It worked, and it still cost a day: Coolify assigns domains per
# compose service, the bare domain ended up on the container that exits by
# design, and Traefik answered "no available server" while the app ran fine.
# One service means one place a domain can point.
#
# Written flat — no YAML anchors, `environment` as a mapping. Coolify parses
# and re-serializes this file before Docker sees it, and list-form environment
# comes back integer-keyed: "non-string key in services.app.environment: 0".
#
# Requires in Coolify:
#   - Build pack: Docker Compose, compose file: coolify-compose.yaml
#   - The domain on the `app` service, written with the container port:
#     https://your-domain.com:3000  (the :3000 tells Coolify where to route;
#     it is not part of the public URL)
#   - Environment variables: DATABASE_URL, DIRECT_URL, ANTHROPIC_API_KEY,
#     ADMIN_USER, ADMIN_PASSWORD, NEXT_PUBLIC_SITE_URL (and the ELEVENLABS_*
#     trio for voice). NEXT_PUBLIC_SITE_URL must also be marked a Build
#     Variable.
#
#     DATABASE_URL and DIRECT_URL are deliberately different connections:
#     DATABASE_URL is the app's pooled runtime connection (e.g. Supabase's
#     transaction-mode pooler on :6543 — src/lib/prisma.ts reads it directly).
#     DIRECT_URL is what prisma.config.ts hands the CLI for `migrate deploy`
#     in scripts/db-migrate.sh, and it must be session-mode or direct — on
#     Supabase, the same pooler host on :5432, or db.<ref>.supabase.co:5432.
#     A transaction-mode pooler can't hold the advisory lock `migrate deploy`
#     needs, so pointing DIRECT_URL at one makes the migration hang forever
#     rather than fail, and the container never becomes healthy.

networks:
  # Coolify's Traefik proxy and its managed Postgres both live here. A stack
  # that is not on this network builds, starts, and is still unreachable.
  coolify:
    external: true
  default: {}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Inlined into the client bundle at build time. Runtime is too late.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    image: softwarepros-app:latest
    restart: unless-stopped
    networks:
      - default
      - coolify
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-}
      # How long the entrypoint tolerates a database that is still coming up.
      MIGRATE_MAX_ATTEMPTS: ${MIGRATE_MAX_ATTEMPTS:-12}
      MIGRATE_RETRY_SECONDS: ${MIGRATE_RETRY_SECONDS:-5}
    expose:
      - "3000"
    healthcheck:
      # A TCP connect rather than an HTTP probe: the image has no curl, and
      # this only needs to answer "is the server accepting connections".
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      # Generous, because migrations run before the server starts listening.
      start_period: 90s
